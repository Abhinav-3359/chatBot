spring.application.name=rag_implementation

# Non-secret values fall back to a local-dev default if the environment
# variable isn't set. Secrets (DB password, API keys, JWT secret) have no
# fallback - they must be set via env var / a local .env, never hardcoded
# here, so startup fails loudly instead of silently reusing a stale value.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/rag_v1}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

logging.level.org.springframework.jdbc.core=DEBUG
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG

spring.servlet.multipart.max-file-size=250MB
spring.servlet.multipart.max-request-size=250MB

pinecone.api-key=${PINECONE_API_KEY}
pinecone.index-url=${PINECONE_INDEX_URL:https://rag3359-72hmgaw.svc.aped-4627-b74a.pinecone.io}

llm.provider=groq
llm.model=${LLM_MODEL:openai/gpt-oss-20b}
groq.api.key=${GROQ_API_KEY}
groq.base.url=${GROQ_BASE_URL:https://api.groq.com/openai/v1/chat/completions}

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# The Python embedding/voice service - was hardcoded in EmbeddingService.java
embedding.service.url=${EMBEDDING_SERVICE_URL:http://localhost:9000}

# Frontend origin for CORS - was hardcoded in CorsConfig.java
cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
