# For the single-VM deployment path (e.g. an Oracle Cloud Always Free
# instance): runs MySQL, the Java backend, the Python voice/embedding
# service, and the frontend together on one host. Copy .env.compose.example
# to .env.compose, fill in real secrets, then:
#
#   docker compose --env-file .env.compose up -d --build
#
# First boot: the mysql container runs db/schema.sql automatically (via
# MySQL's docker-entrypoint-initdb.d convention) to set up the tables.

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: rag_v1
    volumes:
      - mysql-data:/var/lib/mysql
      - ./rag_implementation/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  voice-service:
    build: ./embedding_services
    restart: unless-stopped
    environment:
      JAVA_BACKEND_URL: http://backend:8080
      GROQ_API_KEY: ${GROQ_API_KEY}
    ports:
      - "9000:9000"
    # Whisper/Kokoro/sentence-transformer models load into memory on
    # startup - this took real time locally, give it room before
    # anything depending on it assumes it's ready.

  backend:
    build: ./rag_implementation
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/rag_v1
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
      PINECONE_API_KEY: ${PINECONE_API_KEY}
      PINECONE_INDEX_URL: ${PINECONE_INDEX_URL}
      GROQ_API_KEY: ${GROQ_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      EMBEDDING_SERVICE_URL: http://voice-service:9000
      CORS_ALLOWED_ORIGIN: ${FRONTEND_ORIGIN}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./rag-ui
      args:
        VITE_API_BASE_URL: ${FRONTEND_ORIGIN_API}
        VITE_VOICE_WS_URL: ${FRONTEND_ORIGIN_WS}
    restart: unless-stopped
    ports:
      - "80:80"

volumes:
  mysql-data:
